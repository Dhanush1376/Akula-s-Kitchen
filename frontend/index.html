<!doctype html>
<html lang="en-IN" style="color-scheme: only light; background-color: #ffffff; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover, interactive-widget=resizes-content" />
    

    <!-- Font Loading Fallback Handler -->
    <script>
      // Add a class while fonts are loading, and replace it when they succeed or fail
      if ("fonts" in document) {
        document.documentElement.classList.add('fonts-loading');
        Promise.all([
          document.fonts.load('24px "Material Symbols Outlined"'),
          document.fonts.load('16px "Inter"')
        ]).then(function() {
          document.documentElement.classList.remove('fonts-loading');
          document.documentElement.classList.add('fonts-loaded');
        }).catch(function() {
          document.documentElement.classList.remove('fonts-loading');
          document.documentElement.classList.add('fonts-failed');
        });
      } else {
        document.documentElement.classList.add('fonts-loaded');
      }
    </script>



    <!-- Favicon & Search Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#F7BB0E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Akula's Kitchen" />
    <meta name="application-name" content="Akula's Kitchen" />
    <meta name="format-detection" content="telephone=no" />

    <!-- SEO defaults. On Vercel, api/seo-render.js replaces everything between the
         seo:head markers with page-specific tags; the SPA removes [data-seo-ssr]
         tags on boot and react-helmet-async takes over (see src/main.jsx). -->
    <!--seo:head-->
    <title data-seo-ssr>Akula's Kitchen | Fresh • Tasty • Healthy</title>
    <meta name="description" content="Fresh, homemade idli &amp; dosa batters, authentic traditional pickles, and delicious podis delivered fresh to your doorstep. Fresh • Tasty • Healthy." data-seo-ssr />
    <meta name="keywords" content="dosa batter, idli batter, fresh batter, homemade pickles, tomato pickle, gongura pickle, podi, karam podi, south indian food, breakfast batter, akula's kitchen" data-seo-ssr />
    <meta property="og:type" content="website" data-seo-ssr />
    <meta property="og:site_name" content="Akula's Kitchen" data-seo-ssr />
    <meta property="og:title" content="Akula's Kitchen | Fresh • Tasty • Healthy" data-seo-ssr />
    <meta property="og:description" content="Fresh, homemade idli &amp; dosa batters, authentic traditional pickles, and delicious podis delivered fresh to your doorstep. Fresh • Tasty • Healthy." data-seo-ssr />
    <meta property="og:image" content="https://akulas.kitchen/og-image.png" data-seo-ssr />
    <meta property="og:image:width" content="1200" data-seo-ssr />
    <meta property="og:image:height" content="630" data-seo-ssr />
    <meta name="twitter:card" content="summary_large_image" data-seo-ssr />
    <!--/seo:head-->
    <meta name="author" content="Akula's Kitchen" />

    <!-- Performance: Preconnect & DNS Prefetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin fetchpriority="high" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    
    <!-- Critical Assets Preload -->
    <link rel="preload" as="image" href="/MainLogo.png" type="image/png" fetchpriority="high" />

    <!-- Fonts Preload & Load -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&display=swap" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0..1,0&display=swap" />
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0..1,0&display=swap" />

    <!-- Critical CSS: Prevent FOUC -->
    <style>
      /* Force light-only rendering on all browsers — prevents auto dark inversion */
      html {
        color-scheme: only light !important;
        background-color: #ffffff !important;
      }
      body {
        background-color: #ffffff;
        color: #000000;
      }

      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined', sans-serif;
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        vertical-align: middle;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
      }



      /* Hide ugly ligature text (e.g. "storefront") completely until the font is loaded */
      html:not(.fonts-loaded) .material-symbols-outlined {
        color: transparent !important;
        user-select: none !important;
      }

      html.fonts-loading .material-symbols-outlined::after {
        content: "" !important;
        position: absolute !important;
        inset: 0 !important;
        transform: translateX(-100%) !important;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent) !important;
        animation: font-shimmer 1.5s infinite !important;
      }

      @keyframes font-shimmer {
        100% {
          transform: translateX(100%);
        }
      }

      /* If the font fails to load, preserve invisible text/clean placeholders rather than leaking raw names */
      html.fonts-failed .material-symbols-outlined {
        color: transparent !important;
        background-color: rgba(115, 92, 0, 0.05) !important;
        border-radius: 6px !important;
        width: 1em !important;
        height: 1em !important;
        overflow: hidden !important;
        vertical-align: middle !important;
        user-select: none !important;
        text-shadow: none !important;
      }



      /* Server-rendered crawlable shell (replaced by React on mount) */
      .seo-shell { max-width: 960px; margin: 0 auto; padding: 120px 16px 48px; font-family: Inter, system-ui, sans-serif; color: #283618; line-height: 1.6; }
      .seo-shell nav ol { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; font-size: 12px; }
      .seo-shell img { max-width: 280px; height: auto; border-radius: 12px; }
      .seo-shell a { color: #283618; }

      /* Prevent CLS: reserve space for common layout elements */
      #root {
        min-height: 100vh;
      }

    </style>

  </head>
  <body>
    <!-- Noscript fallback for accessibility -->
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:sans-serif;">
        <h1>JavaScript Required</h1>
        <p>Please enable JavaScript in your browser to use Akula's Kitchen.</p>
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx" fetchpriority="high"></script>

  </body>
</html>
